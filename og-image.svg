<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="673" cy="432" r="31" fill="#9a3412" opacity="0.14"/>
    <circle cx="493" cy="429" r="97" fill="#9a3412" opacity="0.06"/>
    <circle cx="942" cy="312" r="80" fill="#9a3412" opacity="0.11"/>
    <circle cx="325" cy="366" r="69" fill="#9a3412" opacity="0.17"/>
    <circle cx="1060" cy="497" r="67" fill="#9a3412" opacity="0.13"/>
    <circle cx="557" cy="-11" r="26" fill="#9a3412" opacity="0.07"/>
    <rect x="784" y="675" width="64" height="51" rx="8" fill="#c2410c" opacity="0.05" transform="rotate(0, 279, 197)"/>
    <rect x="193" y="608" width="80" height="28" rx="8" fill="#c2410c" opacity="0.11" transform="rotate(6, 980, 492)"/>
    <rect x="773" y="607" width="35" height="35" rx="8" fill="#c2410c" opacity="0.14" transform="rotate(21, 171, -15)"/>
    <rect x="1" y="-8" width="87" height="47" rx="8" fill="#c2410c" opacity="0.09" transform="rotate(28, 129, 288)"/>
    <rect x="211" y="192" width="55" height="83" rx="8" fill="#c2410c" opacity="0.09" transform="rotate(39, 614, 349)"/>
    <rect x="1132" y="377" width="47" height="92" rx="8" fill="#c2410c" opacity="0.15" transform="rotate(21, 768, 148)"/>
    <rect x="236" y="723" width="85" height="80" rx="8" fill="#c2410c" opacity="0.05" transform="rotate(19, 622, 704)"/>
    <rect x="177" y="503" width="80" height="22" rx="8" fill="#c2410c" opacity="0.06" transform="rotate(30, 221, 185)"/>
    <polygon points="902,341 940,417 864,417" fill="#9a3412" opacity="0.04"/>
    <polygon points="1077,328 1114,402 1040,402" fill="#9a3412" opacity="0.10"/>
    <polygon points="1094,-182 1179,-12 1009,-12" fill="#9a3412" opacity="0.07"/>
    <polygon points="723,617 793,757 653,757" fill="#9a3412" opacity="0.04"/>

  <!-- Wave at bottom -->
  <path d="M0,580 C360,605 840,555 1200,580 L1200,630 L0,630Z" fill="#9a3412" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    여의도 노래방 내돈내산
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    여의도 — 노래방
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#fb923c" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#fb923c" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    여의도 여의도 노래방 내돈내산 — 노래방
  </text>
</svg>